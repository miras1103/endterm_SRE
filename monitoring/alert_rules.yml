groups:
  - name: microservices-reliability
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Prometheus cannot scrape {{ $labels.job }} for more than 30 seconds."

      - alert: HighErrorRate
        expr: |
          sum by (service_name) (rate(service_http_requests_total{status_code=~"5.."}[1m]))
          /
          sum by (service_name) (rate(service_http_requests_total[1m]))
          > 0.05
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on {{ $labels.service_name }}"
          description: "More than 5 percent of recent requests are returning 5xx responses."

      - alert: HighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (service_name, le) (rate(service_http_request_duration_seconds_bucket[5m]))
          ) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on {{ $labels.service_name }}"
          description: "The p95 request duration is above 1 second for more than 2 minutes."

      - alert: HighCPUUsage
        expr: avg(rate(node_cpu_seconds_total{mode!="idle"}[1m])) > 0.8
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is above 80%."
