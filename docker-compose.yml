services:
  postgres:
    image: postgres:16-alpine
    container_name: microservices-postgres
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: microservices_app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - application-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d microservices_app"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: auth-service
    environment:
      DATABASE_URL: postgresql://app_user:app_password@postgres:5432/microservices_app
      JWT_SECRET: local-development-secret
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - application-network
    ports:
      - "8001:8001"

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: user-service
    environment:
      DATABASE_URL: postgresql://app_user:app_password@postgres:5432/microservices_app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - application-network
    ports:
      - "8002:8002"

  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    container_name: product-service
    environment:
      DATABASE_URL: postgresql://app_user:app_password@postgres:5432/microservices_app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - application-network
    ports:
      - "8003:8003"

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: order-service
    environment:
      DATABASE_URL: postgresql://app_user:app_password@postgres:5432/microservices_app
      JWT_SECRET: local-development-secret
    depends_on:
      postgres:
        condition: service_healthy
      product-service:
        condition: service_started
    networks:
      - application-network
    ports:
      - "8004:8004"

  chat-service:
    build:
      context: .
      dockerfile: services/chat-service/Dockerfile
    container_name: chat-service
    environment:
      DATABASE_URL: postgresql://app_user:app_password@postgres:5432/microservices_app
      JWT_SECRET: local-development-secret
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - application-network
    ports:
      - "8005:8005"

  api-gateway:
    image: nginx:1.27-alpine
    container_name: api-gateway
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - user-service
      - product-service
      - order-service
      - chat-service
    networks:
      - application-network
    ports:
      - "8080:80"

  frontend:
    image: nginx:1.27-alpine
    container_name: frontend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-gateway
    networks:
      - application-network
    ports:
      - "80:80"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    depends_on:
      - auth-service
      - user-service
      - product-service
      - order-service
      - chat-service
    networks:
      - application-network
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - application-network
    ports:
      - "3000:3000"

networks:
  application-network:
    driver: bridge

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
