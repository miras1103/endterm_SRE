version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      POSTGRES_DB: ${POSTGRES_DB:-microservices_app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      application-network:
        aliases:
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    image: auth-service:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://app_user:app_password@postgres:5432/microservices_app}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret}
    depends_on:
      - postgres
    networks:
      application-network:
        aliases:
          - auth-service
    ports:
      - "8001:8001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8001/health'', timeout=3)"',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  user-service:
    image: user-service:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://app_user:app_password@postgres:5432/microservices_app}
    depends_on:
      - postgres
    networks:
      application-network:
        aliases:
          - user-service
    ports:
      - "8002:8002"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8002/health'', timeout=3)"',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  product-service:
    image: product-service:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://app_user:app_password@postgres:5432/microservices_app}
    depends_on:
      - postgres
    networks:
      application-network:
        aliases:
          - product-service
    ports:
      - "8003:8003"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8003/health'', timeout=3)"',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  order-service:
    image: order-service:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://app_user:app_password@postgres:5432/microservices_app}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret}
    depends_on:
      - postgres
      - product-service
    networks:
      application-network:
        aliases:
          - order-service
    ports:
      - "8004:8004"
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8004/health'', timeout=3)"',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  chat-service:
    image: chat-service:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://app_user:app_password@postgres:5432/microservices_app}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret}
    depends_on:
      - postgres
    networks:
      application-network:
        aliases:
          - chat-service
    ports:
      - "8005:8005"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8005/health'', timeout=3)"',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  payment-service:
    image: payment-service:latest
    restart: unless-stopped
    depends_on:
      - postgres
    networks:
      application-network:
        aliases:
          - payment-service
    ports:
      - "8006:8006"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8006/health'', timeout=3)"',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  api-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - user-service
      - product-service
      - order-service
      - chat-service
      - payment-service
    networks:
      application-network:
        aliases:
          - api-gateway
    ports:
      - "${API_GATEWAY_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-gateway
    networks:
      application-network:
        aliases:
          - frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q --spider http://127.0.0.1/status.html || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    depends_on:
      - auth-service
      - user-service
      - product-service
      - order-service
      - chat-service
    networks:
      application-network:
        aliases:
          - prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      application-network:
        aliases:
          - grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"

networks:
  application-network:
    driver: overlay

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
