<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="stylesheet" href="styles.css" />

  <body>
    <header class="top-bar">
      <a class="brand" href="index.html">Reliability Hub</a>

    <main class="page-shell">
      <section class="page-card">
        <h1>Create Order</h1>
        <label>Product ID</label>
        <input id="productIdInput" type="number" value="1" />
        <label>Quantity</label>
        <input id="quantityInput" type="number" value="1" />
        <button id="createOrderButton">Create Order</button>
        <div id="orderResult" class="result-box"></div>
      </section>
      <section class="page-card spaced-card">
        <div class="page-header">
          <h1>Order History</h1>
          <button id="reloadOrdersButton">Reload</button>
        </div>
        <div id="orderList" class="data-list"></div>
      </section>

    <script src="app.js"></script>
