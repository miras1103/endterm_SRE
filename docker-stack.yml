services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - application-network
    volumes:
      - postgres-data:/var/lib/postgresql/data

  auth-service:
    image: miras-auth-service:latest
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - application-network
    depends_on:
      - postgres

  user-service:
    image: miras-user-service:latest
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - application-network
    depends_on:
      - postgres

  product-service:
    image: miras-product-service:latest
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - application-network
    depends_on:
      - postgres

  order-service:
    image: miras-order-service:latest
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - application-network
    depends_on:
      - postgres

  chat-service:
    image: miras-chat-service:latest
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - application-network
    depends_on:
      - postgres

  api-gateway:
    image: nginx:1.27-alpine
    ports:
      - "${API_GATEWAY_PORT}:80"
    networks:
      - application-network
    depends_on:
      - auth-service
      - user-service
      - product-service
      - order-service
      - chat-service

  frontend:
    image: nginx:1.27-alpine
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - application-network
    depends_on:
      - api-gateway

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "${PROMETHEUS_PORT}:9090"
    networks:
      - application-network

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "${GRAFANA_PORT}:3000"
    networks:
      - application-network

networks:
  application-network:
    driver: overlay

volumes:
  postgres-data:
