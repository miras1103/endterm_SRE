name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/sre-final

jobs:
  ci:
    name: CI - Validate, Lint, And Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare environment file
        shell: bash
        run: cp .env.example .env

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyyaml

      - name: Compile Python services
        run: |
          python -m py_compile \
            services/auth-service/main.py \
            services/user-service/main.py \
            services/product-service/main.py \
            services/order-service/main.py \
            services/chat-service/main.py \
            services/payment-service/main.py \
            services/shared/database.py \
            services/shared/auth.py \
            services/shared/metrics.py

      - name: Validate Docker Compose configuration
        run: docker compose -f docker-compose.yml -f ansible/docker-compose.local.yml config

      - name: Validate project configuration script
        shell: pwsh
        run: ./scripts/validate_config.ps1

      - name: Validate Kubernetes manifest syntax
        run: |
          python -c "import pathlib, yaml; docs=[]; [docs.extend([doc for doc in yaml.safe_load_all(path.read_text()) if doc]) for path in pathlib.Path('k8s').glob('*.yaml')]; assert docs; assert all(doc.get('apiVersion') and doc.get('kind') and doc.get('metadata') for doc in docs)"

      - name: Validate Ansible playbooks syntax
        run: |
          python -m pip install ansible
          ansible-playbook --syntax-check ansible/playbooks/install_docker.yml
          ansible-playbook --syntax-check ansible/playbooks/deploy_compose.yml

      - name: Validate Terraform formatting
        uses: hashicorp/setup-terraform@v3

      - name: Run Terraform formatting check
        run: terraform fmt -check -recursive terraform

      - name: Build Docker images
        run: |
          docker build -t auth-service:ci -f services/auth-service/Dockerfile .
          docker build -t user-service:ci -f services/user-service/Dockerfile .
          docker build -t product-service:ci -f services/product-service/Dockerfile .
          docker build -t order-service:ci -f services/order-service/Dockerfile .
          docker build -t chat-service:ci -f services/chat-service/Dockerfile .
          docker build -t payment-service:ci -f services/payment-service/Dockerfile .

  cd:
    name: CD - Build And Publish Images
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: auth-service
            dockerfile: services/auth-service/Dockerfile
          - name: user-service
            dockerfile: services/user-service/Dockerfile
          - name: product-service
            dockerfile: services/product-service/Dockerfile
          - name: order-service
            dockerfile: services/order-service/Dockerfile
          - name: chat-service
            dockerfile: services/chat-service/Dockerfile
          - name: payment-service
            dockerfile: services/payment-service/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service.name }}
        shell: bash
        run: |
          IMAGE_PREFIX_LC="$(echo '${{ env.IMAGE_PREFIX }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="${{ env.REGISTRY }}/${IMAGE_PREFIX_LC}-${{ matrix.service.name }}"
          docker build -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" -f "${{ matrix.service.dockerfile }}" .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"
